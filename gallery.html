<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Галерея — Моя страничка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="gallery-page">

<!-- ═══ TOP BAR ═══ -->
<div class="topbar">
  <div class="wrapper">
    <nav class="topbar-nav">
      <a href="index.html">главная</a>
      <a href="gallery.html" class="on">галерея</a>
      <a href="projects.html">проекты</a>
      <a href="posts.html">интерактив</a>
    </nav>
  </div>
</div>

<!-- ═══ ГЕРО-БЛОК ГАЛЕРЕИ: ФОН-КАРТИНКА + ЗАГОЛОВОК + СТАТИСТИКА + ФИЛЬТРЫ + ПОИСК ═══ -->
<div class="wrapper">
  <div class="gallery-hero">

    <div class="page-title">
      <h1>Галерея</h1>
      <p class="gallery-subtitle">Мои <span class="shimmer-text">ШЕДЕВРЫ</span></p>
      <p class="gallery-update-note">📸 Фото пополняются каждый день (если не лень)</p>
    </div>

    <div class="gallery-stats" id="galleryStats"></div>

    <div class="gallery-controls">
      <div class="game-filters">
        <button class="game-filter active" data-game="">
          <img src="all.png" alt="Все">
        </button>
        <button class="game-filter" data-game="minecraft">
          <img src="minecraft.svg" alt="Minecraft">
        </button>
        <button class="game-filter" data-game="roblox">
          <img src="roblox.png" alt="Roblox">
        </button>
        <button class="game-filter" data-game="phasmo">
          <img src="phasmo.ico" alt="Phasmophobia">
        </button>
        <button class="game-filter" data-game="rivals">
          <img src="marvel.png" alt="Marvel Rivals">
        </button>
        <button class="game-filter" data-game="dbd">
          <img src="dbd.png" alt="Dead by Daylight">
        </button>
        <button class="game-filter irl" data-game="irl">IRL</button>
      </div>

      <div class="search-row">
        <input type="text" id="searchInput" placeholder="🔍 Искать по комментарию..." />
        <button class="shuffle-button" id="shuffleButton">перемешать</button>
      </div>
    </div>

    <div class="photo-counter" id="photoCounter">Показано: 0 / 0</div>

  </div>
</div>

<!-- ═══ СЕТКА ГАЛЕРЕИ ═══ -->
<div class="wrapper">
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<!-- ═══ FOOTER ═══ -->
<footer class="ft">
  <div class="wrapper">
    <div class="ft-l"><div class="ft-d"></div> Моя страничка · <span id="year"></span></div>
    <div class="ft-r">сделано с .html</div>
  </div>
</footer>

<!-- ═══ LIGHTBOX ═══ -->
<div id="lightbox">
  <span class="close-btn">&times;</span>
  <div class="lightbox-content">
    <img src="" alt="Увеличенное фото" id="lightboxImg" />
    <div class="lightbox-comment" id="lightboxComment"></div>
  </div>
</div>

<script src="gallery.js"></script>
</body>
</html>
