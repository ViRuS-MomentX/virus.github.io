<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Галерея — Моя страничка</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />

<!-- ═══ СТИЛИ ДЛЯ ГЕРО-БЛОКА ГАЛЕРЕИ (фон + статистика + фильтры) ═══ -->
<style>
  .gallery-hero{
    position: relative;
    background-image: linear-gradient(180deg, rgba(10,8,20,.35) 0%, rgba(10,8,20,.55) 55%, rgba(10,8,20,1) 100%),
                       url("images/gallery-bg.png");
    background-size: cover;
    background-position: center;
    padding: 56px 20px 40px;
    text-align: center;
    color: #fff;
  }

  .gallery-hero .page-title{ margin: 0 0 28px; }
  .gallery-hero h1{
    font-size: 2.4rem;
    font-weight: 700;
    margin: 0 0 6px;
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
  }

  /* ── статистика ── */
  .stats-row{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 0 0 22px;
  }
  .stat-card{
    background: rgba(30, 24, 48, .65);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(8px);
    border-radius: 14px;
    padding: 14px 26px;
    min-width: 130px;
  }
  .stat-card .stat-value{
    display: block;
    font-size: 1.4rem;
    font-weight: 700;
    color: #a78bfa;
    font-family: 'JetBrains Mono', monospace;
  }
  .stat-card .stat-label{
    display: block;
    font-size: .7rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
    margin-top: 2px;
  }

  /* ── фильтры по играм ── */
  .filter-row{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 0 0 18px;
  }
  .filter-btn{
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(30, 24, 48, .65);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    padding: 0;
  }
  .filter-btn img{
    width: 24px;
    height: 24px;
    object-fit: contain;
    border-radius: 4px;
  }
  .filter-btn.irl{
    font-size: .75rem;
    font-weight: 600;
    color: #fff;
    letter-spacing: .03em;
  }
  .filter-btn:hover{ transform: translateY(-2px); }
  .filter-btn.active{
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139,92,246,.35);
  }

  /* ── поиск ── */
  #searchInput{
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 0 auto 18px;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(30, 24, 48, .65);
    color: #fff;
    font-size: .95rem;
    outline: none;
  }
  #searchInput::placeholder{ color: rgba(255,255,255,.45); }
  #searchInput:focus{ border-color: #8b5cf6; }

  /* ── кнопка перемешать ── */
  .shuffle-btn{
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 0 auto 14px;
    padding: 13px 18px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #7c5cff, #a78bfa);
    color: #fff;
    font-weight: 600;
    font-size: .95rem;
    cursor: pointer;
    transition: filter .15s ease, transform .15s ease;
  }
  .shuffle-btn:hover{ filter: brightness(1.08); transform: translateY(-1px); }

  #photoCounter{
    font-size: .85rem;
    color: rgba(255,255,255,.6);
  }
</style>
</head>
<body>

<!-- ═══ TOP BAR ═══ -->
<div class="topbar">
  <div class="wrapper">
    <nav class="topbar-nav">
      <a href="index.html">главная</a>
      <a href="gallery.html" class="on">галерея</a>
      <a href="projects.html">проекты</a>
      <a href="posts.html">интерактив</a>
    </nav>
  </div>
</div>

<!-- ═══ ГЕРО: ФОН + ЗАГОЛОВОК + СТАТИСТИКА + ФИЛЬТРЫ + ПОИСК ═══ -->
<div class="gallery-hero">
  <div class="wrapper page-title">
    <h1>Галерея</h1>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <span class="stat-value" id="statTotal">0</span>
      <span class="stat-label">Фото всего</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="statCategories">0</span>
      <span class="stat-label">Категорий</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="statTopGame">—</span>
      <span class="stat-label">Чаще всего в кадре</span>
    </div>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filter-btn active" data-game="">
      <img src="all.png" alt="Все">
    </button>
    <button class="filter-btn" data-game="minecraft">
      <img src="minecraft.svg" alt="Minecraft">
    </button>
    <button class="filter-btn" data-game="roblox">
      <img src="roblox.png" alt="Roblox">
    </button>
    <button class="filter-btn" data-game="phasmo">
      <img src="phasmo.ico" alt="Phasmophobia">
    </button>
    <button class="filter-btn" data-game="rivals">
      <img src="marvel.png" alt="Marvel Rivals">
    </button>
    <button class="filter-btn" data-game="dbd">
      <img src="dbd.png" alt="Dead by Daylight">
    </button>
    <button class="filter-btn irl" data-game="irl">IRL</button>
  </div>

  <input type="text" id="searchInput" placeholder="🔍 Искать по комментарию..." />

  <button class="shuffle-btn" id="shuffleBtn">перемешать</button>

  <div class="photo-counter" id="photoCounter">Показано: 0 / 0</div>
</div>

<!-- ═══ СЕТКА ГАЛЕРЕИ ═══ -->
<div class="wrapper">
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<!-- ═══ FOOTER ═══ -->
<footer class="ft">
  <div class="wrapper">
    <div class="ft-l"><div class="ft-d"></div> Моя страничка · <span id="year"></span></div>
    <div class="ft-r">сделано с .html</div>
  </div>
</footer>

<!-- ═══ LIGHTBOX ═══ -->
<div id="lightbox">
  <span class="close-btn">&times;</span>
  <div class="lightbox-content">
    <img src="" alt="Увеличенное фото" id="lightboxImg" style="display: none;" />
    <div class="placeholder-text" id="lightboxPlaceholder" style="display: none;">Фото отсутствует</div>
    <div class="lightbox-comment" id="lightboxComment"></div>
  </div>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// === ДАННЫЕ ГАЛЕРЕИ ===
const galleryData = [
  { name: 'фух.jpg', comment: 'От судьбы не убежишь', game: 'minecraft' },
  { name: 'фармилка.jpg', comment: 'Обиделся, видимо', game: 'minecraft' },
  { name: 'только не в жопу.jpg', comment: 'Только не в дырку', game: 'rivals' },
  { name: 'таракан.jpg', comment: 'Так быстро пластинку я ещё никогда не нёс', game: 'minecraft' },
  { name: 'сушка.jpg', comment: 'Нам мало что известно о связях Марата', game: 'minecraft' },
  { name: 'рыбка.jpg', comment: 'Водолаз венокс вышел на прогулку', game: 'minecraft' },
  { name: 'предательство.jpg', comment: 'Ножом в спину', game: 'minecraft' },
  { name: 'пинг.jpg', comment: 'Эта травма навсегда останется на компе Зораха', game: 'minecraft' },
  { name: 'китаец.jpg', comment: 'Китаец делал этот спуск', game: 'minecraft' },
  { name: 'джефф.jpg', comment: 'Лучший мой портал', game: 'rivals' },
  { name: 'бамбук.jpg', comment: 'Нелегальнвй бизнес', game: 'minecraft' },
  { name: 'арт.jpg', comment: 'Не надо было пить то зелье...', game: 'minecraft' },
  { name: 'античит.jpg', comment: 'Проверка античита', game: 'minecraft' },
  { name: 'смотрящий.jpg', comment: 'Сквад-ворлд. Золотые времена', game: 'minecraft' },
  { name: 'зима.jpg', comment: 'Куда идём мы с пятачком', game: 'minecraft' },
  { name: 'шахта.jpg', comment: 'Копаем', game: 'minecraft' },
  { name: 'англия.jpg', comment: 'Чёртов английский', game: 'minecraft' },
  { name: 'араб.jpg', comment: 'Новый план Аль-Каиды', game: 'minecraft' },
  { name: 'извращенец.jpg', comment: 'Извращённый взгляд Рафаэля заприметил новую жертву', game: 'minecraft' },
  { name: 'нагрузка.jpg', comment: 'Вирус - реально вирус', game: 'minecraft' },
  { name: 'опомнился.jpg', comment: 'Опомнился', game: 'minecraft' },
  { name: 'паук.jpg', comment: 'Мой подарок мейнеру паука на НГ', game: 'irl' },
  { name: 'тайлер.jpg', comment: 'Тайлера здесь нет', game: 'minecraft' },
  { name: 'лост.jpg', comment: 'Следующие часы будут незабываемыми', game: 'minecraft' },
  { name: 'христос.png', comment: 'Второе пришествие Христа', game: 'minecraft' },
  { name: 'состав.png', comment: 'Куда таким составом', game: 'minecraft' },
  { name: 'крипер.png', comment: 'Так называемый Укротитель цыган', game: 'minecraft' },
  { name: 'касперский.png', comment: 'Похоронил мученика', game: 'minecraft' },
  { name: 'вардены.jpg', comment: 'Нюхачи расплодились', game: 'minecraft' },
  { name: 'внедра.jpg', comment: 'Воздушный дайвер', game: 'minecraft' },
  { name: 'самолёт.jpg', comment: 'Кто мечтает быть пилотом...', game: 'minecraft' },
  { name: 'катаклизм.jpg', comment: 'И поспешил царь в Шамаханское царство', game: 'phasmo' },
  { name: 'дино.jpg', comment: 'Все динозавары боялись т-рекса', game: 'phasmo' },
  { name: 'охота.jpg', comment: 'Двое лучших гостхантеров вышли на охоту', game: 'phasmo' },
  { name: 'рука.png', comment: 'Полтергейст оторвал ему ноги', game: 'phasmo' },
  { name: 'машина.png', comment: 'Полтергейст задавил моего друга', game: 'phasmo' },
  { name: 'лысый.png', comment: 'Гоняем лысого', game: 'phasmo' },
  { name: 'зарядка.png', comment: 'Полтергейст свернул ему ноги', game: 'phasmo' },
  { name: 'IMG_20260624_140422_709.jpg', comment: 'Только зашëл в хардкорный мир, а тут уже встречают', game: 'minecraft' },
  { name: 'IMG_20260624_142151_960.jpg', comment: 'Первый день работы админом коту под хвост', game: 'minecraft' },
  { name: 'IMG_20260624_142055_177.jpg', comment: 'Поганец вирус опять ломает сервер', game: 'minecraft' }
];

const totalSlots = galleryData.length;
const grid = document.getElementById('galleryGrid');
let activeGame = '';

// === НАЗВАНИЯ ИГР ДЛЯ СТАТИСТИКИ ===
const gameNames = {
  minecraft: 'Minecraft',
  roblox: 'Roblox',
  phasmo: 'Phasmophobia',
  rivals: 'Marvel Rivals',
  dbd: 'Dead by Daylight',
  irl: 'IRL'
};

function updateStats(){
  document.getElementById('statTotal').textContent = totalSlots;

  // категорий — по числу кнопок-фильтров игр (без "все" и без IRL)
  const categoryCount = document.querySelectorAll('.filter-btn:not(.irl)').length - 1;
  document.getElementById('statCategories').textContent = categoryCount;

  // самая частая игра
  const counts = {};
  galleryData.forEach(item => {
    counts[item.game] = (counts[item.game] || 0) + 1;
  });
  let topGame = '';
  let topCount = -1;
  Object.keys(counts).forEach(g => {
    if (counts[g] > topCount) { topCount = counts[g]; topGame = g; }
  });
  document.getElementById('statTopGame').textContent = gameNames[topGame] || '—';
}

// === ГЕНЕРАЦИЯ КАРТОЧЕК С УЧЁТОМ ФИЛЬТРА И ПОИСКА ===
function renderGallery(searchText = '') {
  grid.innerHTML = '';
  let visibleCount = 0;

  galleryData.forEach((item, index) => {
    const comment = item.comment;
    const imageName = item.name;

    if (activeGame && item.game !== activeGame) return;
    if (searchText.trim() !== '' && !comment.toLowerCase().includes(searchText.toLowerCase())) return;

    visibleCount++;

    const card = document.createElement('div');
    card.className = 'gallery-item';
    card.dataset.comment = comment;

    const thumb = document.createElement('div');
    thumb.style.width = '100%';
    thumb.style.height = '200px';
    thumb.style.backgroundColor = '#2a2a2a';
    thumb.style.display = 'flex';
    thumb.style.alignItems = 'center';
    thumb.style.justifyContent = 'center';
    thumb.style.color = '#666';
    thumb.style.fontSize = '1rem';
    thumb.style.fontWeight = '500';

    if (imageName) {
      const img = document.createElement('img');
      img.src = imageName;
      img.alt = `Фото ${index + 1}`;
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      img.style.display = 'block';
      thumb.appendChild(img);
    } else {
      thumb.textContent = `Фото ${index + 1}`;
    }

    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = comment;

    card.appendChild(thumb);
    card.appendChild(desc);
    grid.appendChild(card);
  });

  document.getElementById('photoCounter').textContent = `Показано: ${visibleCount} / ${totalSlots}`;
}

// === ПОИСК ===
document.getElementById('searchInput').addEventListener('input', function () {
  renderGallery(this.value);
});

// === ФИЛЬТРЫ ПО ИГРАМ ===
document.querySelectorAll('.filter-btn').forEach(button => {
  button.addEventListener('click', () => {
    const game = button.dataset.game;
    activeGame = (activeGame === game) ? '' : game;

    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    if (activeGame) {
      button.classList.add('active');
    } else {
      document.querySelector('[data-game=""]').classList.add('active');
    }

    renderGallery(document.getElementById('searchInput').value);
  });
});

// === ПЕРЕМЕШАТЬ ===
document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = galleryData.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [galleryData[i], galleryData[j]] = [galleryData[j], galleryData[i]];
  }
  renderGallery(document.getElementById('searchInput').value);
});

updateStats();
renderGallery('');

// === LIGHTBOX ===
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxPlaceholder = document.getElementById('lightboxPlaceholder');
const lightboxComment = document.getElementById('lightboxComment');
const closeBtn = document.querySelector('.close-btn');

function openLightbox(src, comment) {
  if (src) {
    lightboxImg.src = src;
    lightboxImg.style.display = 'block';
    lightboxPlaceholder.style.display = 'none';
  } else {
    lightboxImg.style.display = 'none';
    lightboxPlaceholder.style.display = 'block';
  }
  if (comment) {
    lightboxComment.textContent = comment;
    lightboxComment.style.display = 'block';
  } else {
    lightboxComment.style.display = 'none';
  }
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('active');
  document.body.style.overflow = '';
  lightboxComment.textContent = '';
}

grid.addEventListener('click', (e) => {
  const card = e.target.closest('.gallery-item');
  if (!card) return;
  const img = card.querySelector('img');
  const comment = card.dataset.comment || '';
  if (img) {
    openLightbox(img.src, comment);
  } else {
    openLightbox(null, comment);
  }
});

lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
});
lightboxImg.addEventListener('click', (e) => e.stopPropagation());
lightboxPlaceholder.addEventListener('click', (e) => e.stopPropagation());
lightboxComment.addEventListener('click', (e) => e.stopPropagation());
</script>
</body>
</html>
