<link href="
https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
rel="stylesheet">


<!-- styles -->
<link rel="stylesheet" href="style.css">

<body class="gallery-page">


<!-- =========================
        TOP NAVIGATION
========================= -->


<header class="topbar">

<div class="wrapper">

<nav class="topbar-nav">

главная

галерея

<a href="posts.html">
интерактив
</a>


</nav>

</div>

</header>





<!-- =========================
        HERO
========================= -->


<section class="gallery-hero">


<div class="hero-overlay"></div>


<div class="wrapper">


<h1>
Галерея
</h1>



<div class="gallery-stats" id="galleryStats">

</div>


</div>


</section>





<!-- =========================
        CONTROLS
========================= -->


<section class="gallery-controls wrapper">



<div class="game-filters">


<button class="game-filter active" data-game="">

<img src="images/all.png">
</button>



<button class="game-filter" data-game="minecraft">

<img src="images/minecraft.png">

</button>




<button class="game-filter" data-game="roblox">

<img src="images/roblox.png">

</button>




<button class="game-filter" data-game="phasmo">

<img src="images/phasmo.ico">

</button>




<button class="game-filter" data-game="rivals">

<img src="images/marvel.png">

</button>




<button class="game-filter" data-game="dbd">

<img src="images/dbd.jpg">

</button>




<button class="game-filter irl" data-game="irl">

IRL

</button>


</div>






<div class="search-box">


<div class="search-input">


<span>
⌕
</span>


<input 
id="searchInput"
type="text"
placeholder="Искать по комментарию..."
>


</div>


<button id="shuffleButton">

перемешать

</button>


</div>






<div class="photo-counter" id="photoCounter">

Показано: 0 / 0

</div>




</section>







<!-- =========================
        GALLERY GRID
========================= -->


<main class="wrapper">


<div 
class="gallery-grid"
id="galleryGrid">

</div>


</main>








<!-- =========================
        LIGHTBOX
========================= -->


<div id="lightbox">


<button class="close-btn">
×
</button>


<div class="lightbox-content">


<img 
id="lightboxImg"
src=""
alt=""
>



<div 
class="lightbox-comment"
id="lightboxComment">

</div>



</div>


</div>








<!-- =========================
        FOOTER
========================= -->


<footer class="ft">


<div class="wrapper">


<div class="ft-l">

<div class="ft-d"></div>

Моя страничка ·

<span id="year"></span>

</div>



<div class="ft-r">

сделано с .html

</div>


</div>


</footer>
